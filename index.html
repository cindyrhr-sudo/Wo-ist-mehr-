<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #26323f;
    --muted: #7a8794;
    --accent: #3b82c4;
    --good: #2e9e5b;
    --bad: #d9534f;
    --dot: #3b82c4;
    --dot-red: #e0443e;
    --dot-blue: #3b82c4;
    --line: #9fb3c8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }

  /* ---------- Spielansicht ---------- */
  #game {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; gap: 12px; min-height: 64px;
  }
  .icon-btn {
    border: none; background: var(--card); border-radius: 14px;
    width: 52px; height: 52px; font-size: 26px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12); cursor: pointer;
  }
  .icon-btn:active { transform: scale(.95); }
  #question { font-size: clamp(20px, 3.4vw, 34px); font-weight: 700; text-align: center; flex: 1; }
  #score {
    min-width: 90px; text-align: right; font-size: 20px; font-weight: 700; color: var(--muted);
  }
  #score b { color: var(--good); }

  #fields {
    flex: 1; min-height: 0;
    display: grid; gap: 16px; padding: 4px 16px 8px;
    grid-template-columns: 1fr 1fr;
  }
  @media (orientation: portrait) {
    #fields { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }
  #fields.stack { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .field {
    position: relative; background: var(--card);
    border: 6px solid transparent; border-radius: 28px;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
    padding: 10px; min-height: 0; min-width: 0;
    cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .field:active { transform: scale(.985); }
  .field svg { width: 100%; height: 100%; display: block; }
  .field.good { border-color: var(--good); background: #eaf8ef; }
  .field.bad  { border-color: var(--bad); background: #fdecec; animation: shake .4s; }
  .field.locked { cursor: default; }
  .field .count {
    position: absolute; right: 14px; bottom: 8px;
    font-size: clamp(34px, 6vw, 64px); font-weight: 800;
    color: var(--muted); opacity: 0; transition: opacity .2s;
    pointer-events: none;
  }
  .field.revealed .count { opacity: 1; }
  .field.good .count { color: var(--good); }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  footer {
    min-height: 84px; display: flex; align-items: center; justify-content: center; padding: 8px 16px 14px;
  }
  #next {
    border: none; background: var(--accent); color: #fff;
    font-size: 26px; font-weight: 700; padding: 14px 44px; border-radius: 18px;
    box-shadow: 0 3px 8px rgba(0,0,0,.2); cursor: pointer;
    visibility: hidden;
  }
  #next.show { visibility: visible; animation: pop .25s; }
  #next:active { transform: scale(.96); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- Einstellungen ---------- */
  #settings {
    position: fixed; inset: 0; background: var(--bg); overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
    display: none;
  }
  #settings.open { display: block; }
  .panel { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 34px; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 18px; }
  h2 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 24px 0 10px; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px; }
  .opt {
    border: 3px solid transparent; background: var(--card); border-radius: 16px;
    padding: 12px 20px; font-size: 20px; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }
  .opt.sel { border-color: var(--accent); background: #e8f1fa; color: #1c5d98; }
  .opt.disabled { opacity: .4; pointer-events: none; }
  .opt.emoji { font-size: 34px; padding: 8px 16px; }
  .opt.rand { flex: 1 1 100%; text-align: left; }
  #start {
    display: block; width: 100%; margin-top: 32px; border: none; background: var(--good); color: #fff;
    font-size: 28px; font-weight: 800; padding: 18px; border-radius: 20px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.2);
  }
  #start:active { transform: scale(.98); }
  .hint { color: var(--muted); font-size: 15px; margin-top: 8px; }
</style>
</head>
<body>

<div id="game">
  <header>
    <button class="icon-btn" id="openSettings" aria-label="Einstellungen">⚙️</button>
    <div id="question">Wo ist mehr?</div>
    <div id="score"><b id="sRight">0</b> / <span id="sTotal">0</span></div>
  </header>
  <div id="fields">
    <div class="field" id="fieldA"><div class="count"></div></div>
    <div class="field" id="fieldB"><div class="count"></div></div>
  </div>
  <footer>
    <button id="next">Weiter ➜</button>
  </footer>
</div>

<div id="settings">
  <div class="panel">
    <h1>Wo ist mehr?</h1>
    <p class="sub">Tippe auf das Feld mit mehr Dingen.</p>

    <h2>Darstellung</h2>
    <div class="opts" id="optMode">
      <button class="opt" data-v="items">Gegenstände (unsortiert)</button>
      <button class="opt" data-v="ten">Zehnerfeld</button>
      <button class="opt" data-v="twenty">Zwanzigerfeld</button>
    </div>

    <h2>Zahlenraum</h2>
    <div class="opts" id="optRange">
      <button class="opt" data-v="10">bis 10</button>
      <button class="opt" data-v="20">bis 20</button>
    </div>
    <div class="hint" id="rangeHint"></div>

    <h2>Unterschied</h2>
    <div class="opts" id="optDiff">
      <button class="opt" data-v="3">leicht (Unterschied 3)</button>
      <button class="opt" data-v="2">mittel (Unterschied 2)</button>
      <button class="opt" data-v="1">schwer (Unterschied 1)</button>
    </div>

    <h2 id="motifTitle">Motiv</h2>
    <div class="opts" id="optMotif"></div>
    <div class="hint" id="motifHint"></div>

    <h2>Zahlen anzeigen</h2>
    <div class="opts" id="optShow">
      <button class="opt" data-v="1">nach der Antwort zeigen</button>
      <button class="opt" data-v="0">nie zeigen</button>
    </div>

    <button id="start">Los geht's ➜</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var MOTIFS = [
    { id: 'rand', label: '🎲', title: 'Zufällig pro Aufgabe' },
    { id: '🚗', label: '🚗' }, { id: '🚌', label: '🚌' }, { id: '🚜', label: '🚜' },
    { id: '🚲', label: '🚲' }, { id: '✈️', label: '✈️' }, { id: '🚀', label: '🚀' },
    { id: '🐶', label: '🐶' }, { id: '🐱', label: '🐱' }, { id: '🐸', label: '🐸' },
    { id: '🐞', label: '🐞' }, { id: '🐟', label: '🐟' }, { id: '🦆', label: '🦆' },
    { id: '🍎', label: '🍎' }, { id: '🍓', label: '🍓' }, { id: '🍪', label: '🍪' },
    { id: '⭐', label: '⭐' }, { id: '🎈', label: '🎈' }, { id: '⚽', label: '⚽' }
  ];
  var RANDOM_POOL = MOTIFS.slice(1).map(function (m) { return m.id; });

  var state = { mode: 'items', range: 10, diff: 2, motif: '🚗', show: 1 };
  var round = { a: 0, b: 0, motif: '🚗', done: false, firstTry: true };
  var score = { right: 0, total: 0 };
  var lastPair = '';

  function $(id) { return document.getElementById(id); }
  var fieldA = $('fieldA'), fieldB = $('fieldB');

  /* ---------- Einstellungen speichern (optional, nur Komfort) ---------- */
  function loadState() {
    try {
      var s = JSON.parse(localStorage.getItem('woistmehr.v1') || 'null');
      if (s) for (var k in state) if (s[k] !== undefined) state[k] = s[k];
    } catch (e) {}
  }
  function saveState() {
    try { localStorage.setItem('woistmehr.v1', JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- Hilfsfunktionen ---------- */
  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = rnd(i + 1), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function maxN() {
    if (state.mode === 'ten') return 10;
    if (state.mode === 'twenty') return 20;
    return state.range;
  }

  /* ---------- SVG-Darstellung ---------- */
  var NS = 'http://www.w3.org/2000/svg';

  // Kleiner Zufallsgenerator mit Seed, damit das Bild beim Drehen des iPads stabil bleibt
  function mulberry(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Wählt das Raster (Spalten x Zeilen), bei dem die Gegenstände im Feld am größten werden
  function bestGrid(n, W, H) {
    var best = { cols: 1, rows: n, cell: 0 };
    for (var cols = 1; cols <= n; cols++) {
      var rows = Math.ceil(n / cols);
      var cell = Math.min(W / cols, H / rows);
      if (cell > best.cell + 0.01) best = { cols: cols, rows: rows, cell: cell };
    }
    return best;
  }

  function itemsInner(n, motif, seed, W, H) {
    var rand = mulberry(seed);
    var g = bestGrid(n, W, H);
    var cell = g.cell;
    var ox = (W - g.cols * cell) / 2, oy = (H - g.rows * cell) / 2;
    var cells = [];
    for (var i = 0; i < g.cols * g.rows; i++) cells.push(i);
    for (var j = cells.length - 1; j > 0; j--) {          // Mischen mit Seed
      var r = Math.floor(rand() * (j + 1)), t = cells[j]; cells[j] = cells[r]; cells[r] = t;
    }
    var fs = cell * 0.88;                                  // Gegenstand füllt fast die ganze Zelle
    var jit = cell * 0.05;
    var out = '';
    for (var k = 0; k < n; k++) {
      var c = cells[k];
      var cx = ox + (c % g.cols) * cell + cell / 2 + (rand() * 2 - 1) * jit;
      var cy = oy + Math.floor(c / g.cols) * cell + cell / 2 + (rand() * 2 - 1) * jit;
      var rot = Math.round((rand() * 2 - 1) * 12);
      out += '<text x="' + cx.toFixed(1) + '" y="' + cy.toFixed(1) + '" font-size="' + fs.toFixed(1) +
             '" text-anchor="middle" dominant-baseline="central" transform="rotate(' + rot + ' ' +
             cx.toFixed(1) + ' ' + cy.toFixed(1) + ')">' + motif + '</text>';
    }
    return out;
  }

  function framesSVG(n, twenty) {
    // Zehnerfeld: 5 Spalten x 2 Zeilen. Zwanzigerfeld: 10 Spalten x 2 Zeilen,
    // erste Zeile = erster Zehner, zweite Zeile = zweiter Zehner, dicke 5er-Trennung in der Mitte.
    var cols = twenty ? 10 : 5, rows = 2, w = cols * 100, h = rows * 100;
    var out = '<svg viewBox="-6 -6 ' + (w + 12) + ' ' + (h + 12) + '" preserveAspectRatio="xMidYMid meet" xmlns="' + NS + '">';
    out += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#fff" stroke="var(--line)" stroke-width="5" rx="6"/>';
    var i;
    for (i = 1; i < cols; i++) {
      var thick = (twenty && i === 5);
      out += '<line x1="' + (i * 100) + '" y1="0" x2="' + (i * 100) + '" y2="' + h + '" stroke="var(--line)" stroke-width="' + (thick ? 8 : 3) + '"/>';
    }
    out += '<line x1="0" y1="100" x2="' + w + '" y2="100" stroke="var(--line)" stroke-width="3"/>';
    for (i = 0; i < n; i++) {
      var cx = (i % cols) * 100 + 50, cy = Math.floor(i / cols) * 100 + 50;
      // Zehnerfeld: 1-5 rot, 6-10 blau. Zwanzigerfeld über Kreuz: 1-5 rot, 6-10 blau, 11-15 blau, 16-20 rot
      var blk = Math.floor(i / 5);
      var isRed = twenty ? (blk === 0 || blk === 3) : (blk === 0);
      var col = isRed ? 'var(--dot-red)' : 'var(--dot-blue)';
      out += '<circle cx="' + cx + '" cy="' + cy + '" r="36" fill="' + col + '"/>';
    }
    return out + '</svg>';
  }

  function render(el, n, seed) {
    var old = el.querySelector('svg');
    if (old) old.remove();
    if (state.mode === 'items') {
      el.insertAdjacentHTML('afterbegin', '<svg xmlns="' + NS + '"></svg>');
      var svg = el.querySelector('svg');
      var r = svg.getBoundingClientRect();
      var W = Math.max(r.width, 100), H = Math.max(r.height, 100);
      svg.setAttribute('viewBox', '0 0 ' + W.toFixed(1) + ' ' + H.toFixed(1));
      svg.innerHTML = itemsInner(n, round.motif, seed, W, H);
    } else {
      el.insertAdjacentHTML('afterbegin', framesSVG(n, state.mode === 'twenty'));
    }
  }

  function renderBoth() {
    render(fieldA, round.a, round.seedA);
    render(fieldB, round.b, round.seedB);
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (round.a && !$('settings').classList.contains('open')) renderBoth();
    }, 150);
  });

  /* ---------- Spiellogik ---------- */
  function newRound() {
    // Der Unterschied ist EXAKT state.diff (1, 2 oder 3) – nicht "mindestens".
    var N = maxN(), d = Math.min(state.diff, N - 1), low, high, a, b, key, tries = 0;
    do {
      low = 1 + rnd(N - d);          // kleinere Menge: 1 … N-d
      high = low + d;                // größere Menge: genau d mehr, höchstens N
      if (rnd(2)) { a = high; b = low; } else { a = low; b = high; }
      key = low + '-' + high;
      tries++;
    } while (key === lastPair && tries < 100);
    lastPair = key;

    round.a = a; round.b = b; round.done = false; round.firstTry = true;
    round.seedA = rnd(1e9); round.seedB = rnd(1e9);
    if (state.motif === 'rand') {
      var m, t2 = 0;
      do { m = RANDOM_POOL[rnd(RANDOM_POOL.length)]; t2++; } while (m === round.motif && t2 < 50);
      round.motif = m;
    } else {
      round.motif = state.motif;
    }
    $('fields').classList.toggle('stack', state.mode === 'twenty');

    [fieldA, fieldB].forEach(function (f) {
      f.className = 'field';
      f.querySelector('.count').textContent = '';
    });
    renderBoth();
    $('question').textContent = 'Wo ist mehr?';
    $('next').classList.remove('show');
  }

  function reveal() {
    if (state.show !== 1) return;
    fieldA.querySelector('.count').textContent = round.a;
    fieldB.querySelector('.count').textContent = round.b;
    fieldA.classList.add('revealed');
    fieldB.classList.add('revealed');
  }

  function updateScore() {
    $('sRight').textContent = score.right;
    $('sTotal').textContent = score.total;
  }

  function answer(side) {
    if (round.done) return;
    var el = side === 'A' ? fieldA : fieldB;
    var mine = side === 'A' ? round.a : round.b;
    var other = side === 'A' ? round.b : round.a;
    if (mine > other) {
      round.done = true;
      el.classList.add('good', 'locked');
      (side === 'A' ? fieldB : fieldA).classList.add('locked');
      score.total++;
      if (round.firstTry) score.right++;
      updateScore();
      $('question').textContent = round.firstTry ? '⭐ Richtig!' : '✔ Genau, hier ist mehr!';
      reveal();
      $('next').classList.add('show');
    } else {
      round.firstTry = false;
      el.classList.remove('bad');
      void el.offsetWidth; // Animation neu starten
      el.classList.add('bad');
      $('question').textContent = 'Schau noch einmal genau hin!';
      setTimeout(function () { el.classList.remove('bad'); }, 700);
    }
  }

  fieldA.addEventListener('click', function () { answer('A'); });
  fieldB.addEventListener('click', function () { answer('B'); });
  $('next').addEventListener('click', newRound);

  /* ---------- Einstellungen UI ---------- */
  function markSelected(groupId, value) {
    var btns = $(groupId).querySelectorAll('.opt');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('sel', String(btns[i].getAttribute('data-v')) === String(value));
    }
  }

  function refreshSettingsUI() {
    // Zahlenraum nur bei Gegenständen frei wählbar
    var rangeBtns = $('optRange').querySelectorAll('.opt');
    var fixed = state.mode !== 'items';
    for (var i = 0; i < rangeBtns.length; i++) rangeBtns[i].classList.toggle('disabled', fixed);
    markSelected('optRange', maxN());
    $('rangeHint').textContent = fixed
      ? (state.mode === 'ten' ? 'Beim Zehnerfeld sind es immer Mengen bis 10.' : 'Beim Zwanzigerfeld sind es immer Mengen bis 20.')
      : '';
    markSelected('optMode', state.mode);
    markSelected('optDiff', state.diff);
    markSelected('optShow', state.show);
    markSelected('optMotif', state.motif);
    var items = state.mode === 'items';
    $('optMotif').style.opacity = items ? '1' : '.5';
    $('motifHint').textContent = items ? '' : 'Gilt nur bei „Gegenstände". Tippst du ein Motiv an, wechselt die Darstellung dorthin.';
  }

  function buildMotifButtons() {
    var box = $('optMotif');
    MOTIFS.forEach(function (m) {
      var b = document.createElement('button');
      if (m.id === 'rand') {
        b.className = 'opt rand';
        b.textContent = '🎲 Zufall – jede Runde ein anderes Motiv';
      } else {
        b.className = 'opt emoji';
        b.textContent = m.label;
      }
      b.setAttribute('data-v', m.id);
      box.appendChild(b);
    });
  }

  function bindGroup(groupId, key, parse) {
    $(groupId).addEventListener('click', function (e) {
      var t = e.target.closest('.opt');
      if (!t || t.classList.contains('disabled')) return;
      var v = t.getAttribute('data-v');
      state[key] = parse ? parse(v) : v;
      refreshSettingsUI();
    });
  }

  function openSettings() {
    refreshSettingsUI();
    $('settings').classList.add('open');
  }
  function closeSettings() {
    $('settings').classList.remove('open');
  }

  $('openSettings').addEventListener('click', openSettings);
  $('start').addEventListener('click', function () {
    if (state.mode === 'ten') state.range = 10;
    if (state.mode === 'twenty') state.range = 20;
    saveState();
    score.right = 0; score.total = 0; updateScore();
    lastPair = '';
    closeSettings();
    newRound();
  });

  /* ---------- Start ---------- */
  loadState();
  buildMotifButtons();
  bindGroup('optMode', 'mode');
  bindGroup('optRange', 'range', Number);
  bindGroup('optDiff', 'diff', Number);
  bindGroup('optShow', 'show', Number);
  $('optMotif').addEventListener('click', function (e) {
    var t = e.target.closest('.opt');
    if (!t) return;
    state.motif = t.getAttribute('data-v');
    state.mode = 'items';
    refreshSettingsUI();
  });
  openSettings();

  // Doppeltipp-Zoom auf iOS verhindern
  var lastTouch = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouch < 350) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
